name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Calidad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        run: make install
      - name: Formato y analisis estatico
        run: make check
      - name: Pruebas unitarias e integracion
        run: make test
      - name: Compilar la aplicacion local
        run: make build
      - name: Empaquetar un binario autocontenido
        run: TARGETS="linux/amd64" make package

  browser:
    name: Flujos de navegador
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Instalar dependencias
        run: make install
      - name: Instalar Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Aplicacion local
        run: make e2e
      - name: Portada y demo publicas
        run: npm --prefix web run test:public
      - name: Subir reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
