worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_max_body_size 1k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        listen [::]:8080;
        server_name _;
        root /srv/terradock;
        index index.html;
        set $cache_control "no-cache";
        set $csp "default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'none'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'";

        add_header Cache-Control $cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $csp always;

        gzip on;
        gzip_types text/plain text/css application/javascript application/json application/wasm image/svg+xml;

        location = /healthz {
            default_type application/json;
            return 200 '{"status":"ok","application":"terradock-public"}';
        }

        location = /release.json {
            set $cache_control "no-store";
            try_files $uri =404;
        }

        location /assets/ {
            set $cache_control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # Only the isolated parser worker can compile Wasm and fetch its local
        # binary. The HTML documents retain connect-src 'none' and no eval.
        location ~ ^/assets/demo-engine-[A-Za-z0-9_-]+\.js$ {
            set $cache_control "public, max-age=31536000, immutable";
            set $csp "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self'";
            try_files $uri =404;
        }

        location ~ /\. { return 404; }
        location = /api { return 404; }
        location /api/ { return 404; }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
